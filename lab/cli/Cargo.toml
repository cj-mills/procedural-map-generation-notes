[package]
name = "map-lab"
description = "The map lab's command line for agents: build a map from a recipe, print its tiles and traits, measure many seeds, print the recipe schema."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "map-lab"
path = "src/main.rs"

[dependencies]
map-lab-core = { path = "../core", features = ["report"] }
