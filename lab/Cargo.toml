# The map lab's deterministic generator core and its two consumers. See lab/README.md.
[workspace]
resolver = "3"
members = ["core", "wasm", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# Not `true`: that also drops the `target_features` section, and wasm-bindgen then can't tell
# which Wasm features are on and writes larger glue (size spike, eb49c96). wasm-opt strips the rest.
strip = "debuginfo"

# The CLI runs many seeds; it is built for speed. Its maps are the same: the core has no
# floating-point code whose result depends on optimisation (lab/README.md, Determinism).
[profile.fast]
inherits = "release"
opt-level = 3
